# This workflow is specific to micronaut-aot and is NOT synced from micronaut-project-template.
# It runs aot-bytecode's ClassPathTransform over the runtime class paths of real Micronaut applications and fails when
# a rewritten class verifies worse than the class it replaced. Resolving those class paths downloads a few hundred
# jars, so it is not part of check: it runs when aot-bytecode or its corpus changes, weekly and on demand.
name: Class path corpus
on:
  push:
    branches:
      - '[0-9]+.[0-9]+.x'
    paths:
      - 'aot-bytecode/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/class-path-corpus.yml'
  pull_request:
    branches:
      - '[0-9]+.[0-9]+.x'
    paths:
      - 'aot-bytecode/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/class-path-corpus.yml'
  schedule:
    - cron: '0 5 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  corpus:
    name: "Class path corpus"
    if: github.repository == 'micronaut-projects/micronaut-aot'
    runs-on: ubuntu-latest
    env:
      # Only branch pushes of the Java CI workflow write to the remote build cache.
      ORG_GRADLE_PROJECT_cachePush: false
    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: "🔧 Setup GraalVM CE"
        uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1
        with:
          distribution: 'graalvm'
          java-version: '25'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🔧 Setup Gradle"
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          develocity-access-key: >-
            ${{ (github.event_name == 'push' && secrets.GRADLE_ENTERPRISE_ACCESS_KEY) ||
                (github.event_name != 'push' && (secrets.DEVELOCITY_PULL_REQUEST_ACCESS_KEY || secrets.GRADLE_ENTERPRISE_ACCESS_KEY)) ||
                '' }}

      - name: "🔬 Transform and verify"
        run: ./gradlew :micronaut-aot-bytecode:classPathCorpusTest --no-daemon

      - name: "📜 Upload the test report"
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: class-path-corpus-report
          path: aot-bytecode/build/reports/tests/classPathCorpusTest/**
          if-no-files-found: warn
          retention-days: 30
